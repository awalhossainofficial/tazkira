<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="A black Pill grows from the notch of a Mac screen and shows a zikr, a dua and a durood in turn">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2240"/>
      <stop offset="0.55" stop-color="#2e2547"/>
      <stop offset="1" stop-color="#123a44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#9fb4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9fb4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect width="960" height="280" rx="18"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <mask id="moon">
      <rect x="0" y="0" width="960" height="40" fill="#fff"/>
      <circle cx="773" cy="13" r="6" fill="#000"/>
    </mask>
    <style>
      .ar { font-family: 'Amiri', 'Geeza Pro', 'Noto Naskh Arabic', 'Scheherazade New', 'Traditional Arabic', serif; font-size: 30px; fill: #fff; }
      .tr { font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-style: italic; font-weight: 500; fill: #fff; fill-opacity: 0.9; }
      .mn { font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #fff; fill-opacity: 0.72; }
      .bar { fill: #fff; fill-opacity: 0.32; }
      .clock { font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #fff; fill-opacity: 0.85; }
    </style>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="960" height="280" fill="url(#wall)"/>
    <rect width="960" height="280" fill="url(#glow)"/>

    <!-- Menu bar -->
    <rect width="960" height="32" fill="#fff" fill-opacity="0.07"/>
    <circle cx="26" cy="16" r="6" class="bar"/>
    <rect x="44" y="12" width="42" height="8" rx="4" class="bar"/>
    <rect x="98" y="12" width="26" height="8" rx="4" class="bar"/>
    <rect x="136" y="12" width="26" height="8" rx="4" class="bar"/>
    <rect x="174" y="12" width="32" height="8" rx="4" class="bar"/>
    <circle cx="769" cy="16" r="7" fill="#fff" fill-opacity="0.9" mask="url(#moon)"/>
    <rect x="796" y="12" width="22" height="8" rx="4" class="bar"/>
    <rect x="830" y="12" width="22" height="8" rx="4" class="bar"/>
    <text x="936" y="21" text-anchor="end" class="clock">9:41</text>

    <!-- The Pill: its top sits above the screen, so only the bottom corners show as rounded -->
    <g filter="url(#shadow)">
      <rect y="-40" fill="#000" x="380" width="200" height="72" rx="12">
        <animate attributeName="x" dur="18s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.0333;0.2778;0.3056;0.3333;0.3667;0.6111;0.6389;0.6667;0.7;0.9444;0.9722;1"
          keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1"
          values="380;180;180;380;380;180;180;380;380;180;180;380;380"/>
        <animate attributeName="width" dur="18s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.0333;0.2778;0.3056;0.3333;0.3667;0.6111;0.6389;0.6667;0.7;0.9444;0.9722;1"
          keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1"
          values="200;600;600;200;200;600;600;200;200;600;600;200;200"/>
        <animate attributeName="height" dur="18s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.0333;0.2778;0.3056;0.3333;0.3667;0.6111;0.6389;0.6667;0.7;0.9444;0.9722;1"
          keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.8 0.2;0 0 1 1"
          values="72;220;220;72;72;220;220;72;72;220;220;72;72"/>
        <animate attributeName="rx" dur="18s" repeatCount="indefinite"
          keyTimes="0;0.0333;0.2778;0.3056;0.3333;0.3667;0.6111;0.6389;0.6667;0.7;0.9444;0.9722;1"
          values="12;36;36;12;12;36;36;12;12;36;36;12;12"/>
      </rect>
    </g>

    <!-- Zikr -->
    <g text-anchor="middle" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
        keyTimes="0;0.025;0.0444;0.2667;0.2806;1" values="0;0;1;1;0;0"/>
      <text x="480" y="84" class="ar" direction="rtl">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</text>
      <text x="480" y="120" class="tr">Subhan Allahi wa bihamdihi</text>
      <text x="480" y="148" class="mn">Glory be to Allah and praise be to Him.</text>
    </g>

    <!-- Dua -->
    <g text-anchor="middle" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
        keyTimes="0;0.3583;0.3778;0.6;0.6139;1" values="0;0;1;1;0;0"/>
      <text x="480" y="84" class="ar" direction="rtl">اللَّهُمَّ أَعِنِّي عَلَىٰ ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ</text>
      <text x="480" y="120" class="tr">Allahumma a'inni 'ala dhikrika wa shukrika wa husni 'ibadatik</text>
      <text x="480" y="148" class="mn">O Allah, help me to remember You, to thank You, and to worship You well.</text>
    </g>

    <!-- Durood -->
    <g text-anchor="middle" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
        keyTimes="0;0.6917;0.7111;0.9333;0.9472;1" values="0;0;1;1;0;0"/>
      <text x="480" y="84" class="ar" direction="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ</text>
      <text x="480" y="120" class="tr">Sallallahu 'alayhi wa sallam</text>
      <text x="480" y="148" class="mn">May Allah send blessings and peace upon him (the Prophet Muhammad).</text>
    </g>
  </g>
</svg>
