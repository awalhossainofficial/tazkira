<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="The four Pill Styles: Island, Wings, Peek and Drop Card">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2240"/>
      <stop offset="0.55" stop-color="#2e2547"/>
      <stop offset="1" stop-color="#123a44"/>
    </linearGradient>
    <clipPath id="panel"><rect width="460" height="250" rx="14"/></clipPath>
    <clipPath id="card"><rect x="70" y="32" width="320" height="148" rx="18"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <mask id="cm" maskUnits="userSpaceOnUse" x="-10" y="-10" width="20" height="20">
      <rect x="-10" y="-10" width="20" height="20" fill="#fff"/>
      <circle cx="2.6" cy="-2" r="4.2" fill="#000"/>
    </mask>
    <g id="crescent"><circle r="4.8" fill="#fff" mask="url(#cm)"/></g>
    <g id="screen">
      <rect width="460" height="250" fill="url(#wall)"/>
      <rect width="460" height="22" fill="#fff" fill-opacity="0.07"/>
      <circle cx="18" cy="11" r="4" fill="#fff" fill-opacity="0.3"/>
      <rect x="30" y="8" width="30" height="6" rx="3" fill="#fff" fill-opacity="0.3"/>
      <rect x="68" y="8" width="20" height="6" rx="3" fill="#fff" fill-opacity="0.3"/>
      <rect x="400" y="8" width="20" height="6" rx="3" fill="#fff" fill-opacity="0.3"/>
      <rect x="426" y="8" width="18" height="6" rx="3" fill="#fff" fill-opacity="0.3"/>
      <rect x="170" y="-20" width="120" height="42" rx="8" fill="#000"/>
    </g>
    <style>
      .ar { font-family: 'Amiri', 'Geeza Pro', 'Noto Naskh Arabic', 'Scheherazade New', 'Traditional Arabic', serif; fill: #fff; }
      .ui { font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fff; }
      .tr { font-size: 10.5px; font-style: italic; font-weight: 500; fill-opacity: 0.9; }
      .mn { font-size: 10px; fill-opacity: 0.72; }
      .name { font-size: 15px; font-weight: 700; }
      .cap { font-size: 12px; fill-opacity: 0.7; }
    </style>
  </defs>

  <!-- Island -->
  <g clip-path="url(#panel)">
    <use xlink:href="#screen" href="#screen"/>
    <rect x="60" y="-30" width="340" height="164" rx="26" fill="#000" filter="url(#shadow)"/>
    <g text-anchor="middle">
      <text x="230" y="58" class="ar" font-size="18" direction="rtl">اللَّهُمَّ أَعِنِّي عَلَىٰ ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ</text>
      <text x="230" y="82" class="ui tr">Allahumma a'inni 'ala dhikrika wa shukrika wa husni 'ibadatik</text>
      <text x="230" y="101" class="ui mn">O Allah, help me to remember You,</text>
      <text x="230" y="115" class="ui mn">to thank You, and to worship You well.</text>
    </g>
    <text x="22" y="216" class="ui name">Island</text>
    <text x="22" y="235" class="ui cap">Grows out of the notch into a card.</text>
  </g>

  <!-- Wings -->
  <g transform="translate(480 0)">
    <g clip-path="url(#panel)">
      <use xlink:href="#screen" href="#screen"/>
      <rect x="20" y="-30" width="420" height="64" rx="16" fill="#000" filter="url(#shadow)"/>
      <use xlink:href="#crescent" href="#crescent" x="42" y="17" opacity="0.8"/>
      <text x="54" y="21" class="ui" font-size="10.5" fill-opacity="0.8">Alhamdulillah</text>
      <text x="365" y="23" class="ar" font-size="15" text-anchor="middle" direction="rtl">الْحَمْدُ لِلَّهِ</text>
      <text x="22" y="216" class="ui name">Wings</text>
      <text x="22" y="235" class="ui cap">A thin strip either side of the notch.</text>
    </g>
  </g>

  <!-- Peek -->
  <g transform="translate(0 270)">
    <g clip-path="url(#panel)">
      <use xlink:href="#screen" href="#screen"/>
      <rect x="110" y="-30" width="240" height="82" rx="22" fill="#000" filter="url(#shadow)"/>
      <text x="230" y="42" class="ar" font-size="17" text-anchor="middle" direction="rtl">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</text>
      <text x="22" y="216" class="ui name">Peek</text>
      <text x="22" y="235" class="ui cap">Just the Arabic. Hover to see the rest.</text>
    </g>
  </g>

  <!-- Drop Card -->
  <g transform="translate(480 270)">
    <g clip-path="url(#panel)">
      <use xlink:href="#screen" href="#screen"/>
      <rect x="70" y="32" width="320" height="148" rx="18" fill="#000" filter="url(#shadow)"/>
      <use xlink:href="#crescent" href="#crescent" x="90" y="51" opacity="0.55"/>
      <text x="100" y="55" class="ui" font-size="9.5" font-weight="600" fill-opacity="0.55">Tazkira</text>
      <rect x="326" y="44" width="50" height="15" rx="7.5" fill="#fff" fill-opacity="0.12"/>
      <text x="351" y="55" class="ui" font-size="8.5" font-weight="500" fill-opacity="0.85" text-anchor="middle">durood</text>
      <g text-anchor="middle">
        <text x="230" y="86" class="ar" font-size="18" direction="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ</text>
        <text x="230" y="107" class="ui tr">Sallallahu 'alayhi wa sallam</text>
        <text x="230" y="124" class="ui mn">May Allah send blessings and peace upon him</text>
        <text x="230" y="137" class="ui mn">(the Prophet Muhammad).</text>
        <text x="230" y="157" class="ui" font-size="8.5" fill-opacity="0.42">Quran 33:56, Sahih Muslim 408</text>
      </g>
      <g clip-path="url(#card)">
        <rect x="70" y="177" width="320" height="3" fill="#fff" fill-opacity="0.08"/>
        <rect x="70" y="177" width="320" height="3" fill="#fff" fill-opacity="0.55">
          <animate attributeName="width" dur="8s" repeatCount="indefinite" values="320;0"/>
        </rect>
      </g>
      <text x="22" y="216" class="ui name">Drop Card</text>
      <text x="22" y="235" class="ui cap">A card below the menu bar, with a timer.</text>
    </g>
  </g>
</svg>
